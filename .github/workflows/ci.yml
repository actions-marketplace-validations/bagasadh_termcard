name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check web JS syntax
        run: node --check web/app.js && node --check web/canvas.js && node --check web/renderer.js && node --check web/sound.js
      - name: Run Python and JS renderer parity checks
        run: node tests/check_parity.mjs

